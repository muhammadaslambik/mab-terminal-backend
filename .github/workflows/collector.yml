name: collector

on:
  workflow_dispatch:
    inputs:
      smoke:
        description: "Mode uji kecil (true/false)"
        default: "true"

permissions:
  contents: read

env:
  # Ganti dengan hash commit idx-bei yang sudah Anda uji (git -C <folder idx-bei> rev-parse HEAD)
  IDX_BEI_REF: afdb5b039b1e437e73cf67a126032523ee0b5770

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pasang idx-bei
        run: pip install "git+https://github.com/nichsedge/idx-bei.git@${{ env.IDX_BEI_REF }}#subdirectory=python"
      - name: Jalankan kolektor
        working-directory: collector
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then
            python collect_intel.py --smoke
          else
            python collect_intel.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intel
          path: collector/intel.json
          if-no-files-found: ignore
